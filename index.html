<!DOCTYPE html>
<html lang="en">
<head>

	<meta name="twitter:image" content="" />

	<meta property="og:type" content="website" />

	<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg?v=1" />
	<link rel="shortcut icon" href="assets/logo/favicon.ico?v=1" />
	<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png" />

</head>
<body>
	<aside>
		<div class="square-container" aria-hidden="true">
			<div class="square1"></div>
			<div class="square2"></div>
			<div class="square3"></div>
			<div class="square4"></div>
		</div>
		<h2>Dashboard</h2>

		<nav class="nav-container">
			<ul class="navigation">
				<li><a href="/">Home</a></li>
				<li><a href="/">Profile</a></li>
				<li><a href="/">Messages</a></li>
				<li><a href="/">History</a></li>
				<li><a href="/">Tasks</a></li>
				<li><a href="/">Communities</a></li>
			</ul>

			<ul class="permission">
				<li><a href="/">Settings</a></li>
				<li><a href="/">Support</a></li>
				<li><a href="/">Privacy</a></li>
			</ul>
		</nav>
	</aside>

	<header>
		<search>
			<form class="search-container" action="#" method="get">
				<button type="submit">
					<img src="assets/img/search.svg" alt="Search button">
				</button>
				<input class="searchbox" type="search" inputmode="search">
			</form>
		</search>

		<img
			class="notification"
			src="assets/img/notification.svg"
			alt="notification"
		>

		<img
			class="profile-picture"
			src="assets/img/profile-picture.jpg"
			alt="Profile"
		>

		<p class="name"><a href="https://github.com/AzamAzis">Azam Azis</a></p>

		<div class="container">
			<img src="assets/img/profile-picture.jpg" alt="Profile">

			<div class="welcome">
				<p class="greeting">Hi there,</p>
				<h1 class="name">Azam Azis (@AzamAzis)</h1>
			</div>

			<button type="button">New</button>
			<button type="button">Upload</button>
			<button type="button">Share</button>
		</div>
	</header>

	<main>
		<h2 class="title">Your Projects</h2>
		<div class="projects-container">
			<div class="project"></div>
			<div class="project"></div>
			<div class="project"></div>
			<div class="project"></div>
			<div class="project"></div>
			<div class="project"></div>
		</div>

		<h2 class="title">Announcement</h2>
		<div class="announcements-container">
			<div class="announcement"></div>
			<div class="announcement"></div>
			<div class="announcement"></div>
		</div>

		<h2 class="title">Trending</h2>
		<div class="trends-container">
			<div class="trend"></div>
			<div class="trend"></div>
			<div class="trend"></div>
			<div class="trend"></div>
		</div>
	</main>
</body>
</html>
