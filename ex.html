<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.box {
			background-image: linear-gradient(royalblue, blue);
			height: 100px;
			width: 100px;
			transition: all 1s ease-in;
		}

		.ball {
			background-color: black;
			padding: 1rem;
			width: 100px;
		}

		.ball:hover + .box {
			width: 100px;
		}

		p {
			visibility: hidden;
			transition: all 3s ease-in;
		}

		.box:hover + p {
			visibility: visible;
		}
	</style>
</head>
<body>
	<div class="ball"></div>
	<div class="box"></div>
	<p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Velit, officia?</p>
</body>
</html>
