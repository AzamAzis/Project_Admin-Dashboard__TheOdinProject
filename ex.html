<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.sidebar {
			position: absolute;
			width: 500px;
			background-color: royalblue;
			margin-top: 2rem;
			padding: 1rem;
			transform: translateY(-200%);
			transition: transform 1s ease-in;
		}
	</style>
</head>
<body>
	<button type="button">Click me</button>
	<aside class="sidebar">
		<nav class="nav-container">
			<ul class="navigation">
				<li class="menu"><a class="menu__link" href="/">Home</a></li>
				<li class="menu"><a class="menu__link" href="/">Profile</a></li>
				<li class="menu"><a class="menu__link" href="/">Messages</a></li>
				<li class="menu"><a class="menu__link" href="/">History</a></li>
				<li class="menu"><a class="menu__link" href="/">Tasks</a></li>
				<li class="menu"><a class="menu__link" href="/">Communities</a></li>
			</ul>
			<ul class="permission">
				<li class="menu"><a class="menu__link" href="/">Settings</a></li>
				<li class="menu"><a class="menu__link" href="/">Support</a></li>
				<li class="menu"><a class="menu__link" href="/">Privacy</a></li>
			</ul>
		</nav>
	</aside>

	<p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Deserunt, autem.</p>
	<script>
		const btn = document.querySelector('button');
		const para = document.querySelector(".sidebar");

		btn.addEventListener("click", (event) => {
			para.style.transform = "translateY(0)";
		});
	</script>
</body>
</html>
